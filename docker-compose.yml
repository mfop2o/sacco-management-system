version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sacco-postgres
    environment:
      POSTGRES_DB: sacco_db
      POSTGRES_USER: sacco_user
      POSTGRES_PASSWORD: sacco_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacco_user -d sacco_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sacco-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sacco-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sacco_user
      RABBITMQ_DEFAULT_PASS: sacco_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sacco-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sacco_db
      SPRING_DATASOURCE_USERNAME: sacco_user
      SPRING_DATASOURCE_PASSWORD: sacco_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sacco_user
      SPRING_RABBITMQ_PASSWORD: sacco_password
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-change-in-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sacco-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
