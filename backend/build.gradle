//             project: project,
//             version: version,
//             buildTime: new Date().format("yyyy-MM-dd HH:mm:ss")
//         )
//     }
// }

// ============================================
// GRADLE WRAPPER VALIDATION
// ============================================

wrapper {
    gradleVersion = '8.7'
    distributionType = Wrapper.DistributionType.BIN
}

// ============================================
// COMPILE JAVA OPTIONS
// ============================================

compileJava {
    options.compilerArgs << '-parameters'
    options.encoding = 'UTF-8'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

// ============================================
// TASK FOR FRONTEND INTEGRATION
// ============================================

tasks.register('copyFrontendBuild', Copy) {
    dependsOn 'buildFrontend'
    from '../frontend/dist'
    into 'src/main/resources/static'
    doLast {
        println 'Frontend build copied to resources'
    }
}

tasks.named("processResources") {
    dependsOn(copyFrontendBuild)
}

tasks.register('buildFrontend', Exec) {
    workingDir = file('../frontend')
    group = 'build'
    description = 'Build React frontend application'
    
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'npm.cmd', 'run', 'build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
    
    doFirst {
        println 'Building frontend...'
    }
}

// Build frontend before bootJar
bootJar.dependsOn copyFrontendBuild

// ============================================
// TASK FOR DATABASE BACKUP
// ============================================

tasks.register('backupDatabase', Exec) {
    group = 'database'
    description = 'Backup PostgreSQL database'
    commandLine 'pg_dump', '-U', 'sacco_user', '-h', 'localhost', '-d', 'sacco_db', '-F', 'c', '-f', 'backup.dump'
}

// ============================================
// TASK FOR GENERATING API DOCUMENTATION
// ============================================

tasks.register('generateApiDocs', Exec) {
    group = 'documentation'
    description = 'Generate OpenAPI documentation'
    dependsOn bootRun
    commandLine 'curl', '-o', 'api-docs.json', 'http://localhost:8080/api/v3/api-docs'
}

// ============================================
// GIT PRE-COMMIT HOOK (Optional)
// ============================================

tasks.register('installGitHooks', Copy) {
    from 'scripts/pre-commit'
    into '.git/hooks'
    fileMode 0755
}

// ============================================
// DEPENDENCY VERSION REPORT
// ============================================

tasks.register('dependencyReport') {
    group = 'documentation'
    description = 'Generate dependency version report'
    doLast {
        println '=== Dependency Version Report ==='
        project.configurations.each { config ->
            println "\n${config.name}:"
            config.dependencies.each { dep ->
                println "  ${dep.group}:${dep.name}:${dep.version}"
            }
        }
    }
}

// ============================================
// SPRING BOOT CONFIGURATION
// ============================================

springBoot {
    buildInfo {
        properties {
            artifact = 'sacco-backend'
            version = project.version
            group = project.group
            name = 'SACCO Management System Backend'
        }
    }
}