spring:
  application:
    name: sacco-backend
  
  docker:
    compose:
      enabled: false
  
  datasource:
    url: jdbc:postgresql://localhost:5432/sacco_db
    username: sacco_user
    password: sacco_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 1
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  
  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-this-in-production}
      expiration: 86400000
      refresh-expiration: 604800000
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8082
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.sacco: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/sacco-backend.log
    max-size: 10MB
    max-history: 30

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:4173
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Custom SACCO Configuration
sacco:
  loan:
    max-amount: 500000
    min-amount: 1000
    default-interest-rate: 12.5
    max-duration-months: 360
  savings:
    min-balance: 100
    default-interest-rate: 5.0
  share:
    par-value: 100
    min-purchase: 1
  reporting:
    default-format: PDF
    max-records: 10000