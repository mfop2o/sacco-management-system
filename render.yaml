# Render Blueprint: SACCO backend + database
# Deploy: push this repo to GitHub, then in Render Dashboard -> New -> Blueprint,
# select the repo. Render creates the Postgres DB and wires DATABASE_URL automatically.
services:
  - type: web
    name: sacco-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_CACHE_TYPE
        value: simple
      - key: CORS_ALLOWED_ORIGINS
        value: https://sacco.lovestoblog.com,http://localhost:5173,http://localhost:4173
      - key: DATABASE_URL
        fromDatabase:
          name: sacco-db
          property: connectionString

databases:
  - name: sacco-db
    plan: free
    databaseName: sacco_db
    user: sacco_user
